[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govq-core"
version = "0.1.0"
description = "Minimal public GOVQ execution contracts and canonical provider input commitments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GOVQ Core Contributors" }]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"